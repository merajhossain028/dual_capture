name: dual_capture
description: >-
  A Flutter package for dual camera capture. Sequentially captures
  the back then front camera, composites them into a single JPEG with a
  configurable picture-in-picture overlay, and returns a DualCaptureResult
  containing the composited file plus both raw files.
version: 0.1.0
homepage: https://github.com/yourusername/dual_capture
repository: https://github.com/yourusername/dual_capture
issue_tracker: https://github.com/yourusername/dual_capture/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image: ^4.1.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

topics:
  - camera
  - image-processing
  - photo
  - dual-camera
  - picture-in-picture

platforms:
  android:
  ios:

flutter:
