name: dual_capture
description: >-
  Capture back and front camera in sequence and composite them into a single
  JPEG with a configurable picture-in-picture overlay.
version: 0.1.1
homepage: https://github.com/merajhossain028/dual_capture
repository: https://github.com/merajhossain028/dual_capture
issue_tracker: https://github.com/merajhossain028/dual_capture/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.11.0+2 <0.13.0'
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

topics:
  - camera
  - image-processing
  - photo
  - dual-camera
  - picture-in-picture

platforms:
  android:
  ios:

flutter:
